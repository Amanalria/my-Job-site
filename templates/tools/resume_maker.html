<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sarkari Bio-Data &amp; Resume Builder – {{ settings.site_name }}</title>
    <link rel="stylesheet" href="/wp-content/themes/generatepress/assets/css/main.min.css">
    <link rel="stylesheet" href="/wp-content/uploads/generateblocks/style-32.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .tool-card { background: #fff; border: 1px solid #cecece; border-radius: 6px; padding: 24px; max-width: 750px; margin: 20px auto; }
        .input-row { margin-bottom: 14px; }
        .input-row label { display: block; font-weight: 700; font-size: 13px; margin-bottom: 4px; color: #334155; }
        .input-row input, .input-row textarea { width: 100%; padding: 8px 10px; border: 1px solid #cbd5e1; border-radius: 4px; box-sizing: border-box; }
        .btn-action { background: #a80909; color: #fff; border: none; padding: 12px 24px; border-radius: 4px; font-weight: 700; font-size: 15px; cursor: pointer; }
        @media print {
            .site-header, .main-navigation, .site-footer, .no-print { display: none !important; }
            .tool-card { border: none; box-shadow: none; max-width: 100%; padding: 0; }
        }
    </style>
</head>
<body>

<div class="site-header">
    <header class="site-header" style="text-align:center; padding:15px 10px 10px; background:#fff;">
        <h1 style="font-size:32px; font-weight:800; color:#ab183d; margin:0; text-transform:uppercase; font-family:'Noto Sans', sans-serif;">
            <a href="/" style="color:#ab183d; text-decoration:none;">{{ settings.site_name }}</a>
        </h1>
        <p class="site-description" style="font-size:14px; font-weight:700; color:#222; margin:2px 0 0; text-transform:uppercase;">
            WWW.{{ settings.domain }}
        </p>
    </header>
    <nav class="main-navigation" style="background:#a80909; text-align:center; padding:0;">
        <div style="max-width:1100px; margin:0 auto; display:flex; flex-wrap:wrap; justify-content:center;">
            <a href="/" style="color:#fff; padding:10px 16px; text-decoration:none; font-weight:700; font-size:14px;">Home</a>
            <a href="/tools/resume-maker" style="color:#fff; padding:10px 16px; text-decoration:none; font-weight:700; font-size:14px; background:#8b0000;">Bio-Data Builder</a>
        </div>
    </nav>
</div>

<div class="site-content" style="max-width:1050px; margin:20px auto; padding:0 12px;">
    <div class="tool-card">
        <h2 class="no-print" style="font-size:22px; font-weight:800; color:#a80909; text-align:center; margin-top:0; margin-bottom:20px;">
            Sarkari Bio-Data &amp; Resume Format Generator
        </h2>
        <div class="no-print">
            <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px;">
                <div class="input-row"><label>Full Name</label><input type="text" id="name" placeholder="Rahul Kumar"></div>
                <div class="input-row"><label>Father's Name</label><input type="text" id="fname" placeholder="Shri ..."></div>
                <div class="input-row"><label>Date of Birth</label><input type="date" id="dob"></div>
                <div class="input-row"><label>Mobile / Email</label><input type="text" id="contact" placeholder="+91 ..."></div>
            </div>
            <div class="input-row"><label>Address</label><textarea id="address" rows="2" placeholder="Full permanent address..."></textarea></div>
            <div class="input-row"><label>Educational Qualifications</label><textarea id="edu" rows="3" placeholder="10th (CBSE), 12th (UP Board), B.A / B.Tech (University)..."></textarea></div>
            <button class="btn-action" onclick="window.print()"><i class="fa-solid fa-print"></i> Print / Save as PDF</button>
        </div>
    </div>
</div>
</body>
</html>
